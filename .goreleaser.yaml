# Release build: static agent binaries for linux/amd64 and linux/arm64, the
# laptop CLI for macOS and Windows (amd64, arm64), checksums.txt, the
# multi-arch panel image, and the rendered install.sh. The release manifest
# (manifest.json, read by the panel and the agents to update) needs the
# pushed image's digest, so scripts/release-manifest.sh writes and uploads it
# after this run.
#
# Nothing here signs. The before hooks run every npm build script, so this
# run never gets the release key: scripts/release-sign.sh signs
# checksums.txt and manifest.json afterwards, in a tag release in its own
# job (.github/workflows/release.yml, Sign).
#
# Brand values come from installer/brand.env as BRAND_* environment
# variables, and GO_MODULE from go/go.mod; run through the Makefile
# (`make release` or `make release-snapshot`), which exports them.
version: 2
project_name: "{{ .Env.BRAND_SLUG }}"

before:
  hooks:
    - bun install --frozen-lockfile
    - bun run build
    # Not into dist/: goreleaser refuses a dist/ that is not empty after
    # these hooks.
    - scripts/render-installer.sh {{ .Version }} build/install.sh

builds:
  - id: agent
    dir: go
    main: ./cmd/seylo
    binary: "{{ .Env.BRAND_SLUG }}"
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X {{ .Env.GO_MODULE }}/internal/version.Version={{ .Version }}
      - -X {{ .Env.GO_MODULE }}/internal/version.Commit={{ .ShortCommit }}
      - -X {{ .Env.GO_MODULE }}/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  # The laptop CLI for macOS and Windows (same binary; node commands answer
  # that they run on a Linux server). Only the linux builds go into the
  # update manifest.
  - id: cli
    dir: go
    main: ./cmd/seylo
    binary: "{{ .Env.BRAND_SLUG }}"
    env:
      - CGO_ENABLED=0
    goos: [darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X {{ .Env.GO_MODULE }}/internal/version.Version={{ .Version }}
      - -X {{ .Env.GO_MODULE }}/internal/version.Commit={{ .ShortCommit }}
      - -X {{ .Env.GO_MODULE }}/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # Plain binaries: the installer and the agent updater download them as is
  # (<slug>_linux_arm64, <slug>_darwin_arm64, <slug>_windows_amd64.exe).
  - id: binaries
    ids: [agent, cli]
    formats: [binary]
    name_template: "{{ .Env.BRAND_SLUG }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256
  # release.extra_files are not checksummed on their own: list them here
  # too, so every file the release attaches is covered by the signature of
  # checksums.txt (scripts/release-sign.sh and scripts/release-publish.sh
  # refuse a checksums.txt without them). This only adds lines to
  # checksums.txt; release.extra_files uploads them.
  extra_files:
    - glob: build/install.sh
    - glob: openapi.json

dockers_v2:
  - id: panel
    ids: [agent]
    dockerfile: deploy/panel.Dockerfile
    images:
      - "{{ .Env.BRAND_IMAGE }}"
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - apps/panel/package.json
      - apps/panel/dist
      - apps/panel/drizzle
      - apps/web/dist
      - templates
      - deploy/panel-entrypoint.sh
    build_args:
      VERSION: "{{ .Version }}"
      REVISION: "{{ .FullCommit }}"
      ENV_PREFIX: "{{ .Env.BRAND_ENV_PREFIX }}"
      DATA_DIR: "{{ .Env.BRAND_DATA_DIR }}"
    labels:
      org.opencontainers.image.source: "https://github.com/{{ .Env.BRAND_GITHUB_ORG }}/{{ .Env.BRAND_GITHUB_REPO }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"

# With an rc and its final tag on the same commit, pick the final one (the
# release workflow names the tag outright with GORELEASER_CURRENT_TAG).
git:
  prerelease_suffix: "-"

release:
  github:
    owner: "{{ .Env.BRAND_GITHUB_ORG }}"
    name: "{{ .Env.BRAND_GITHUB_REPO }}"
  draft: true
  # Re-running the Draft release job replaces the draft an earlier run left
  # instead of adding a second draft with the same tag (Publish refuses a tag
  # that several releases carry).
  replace_existing_draft: true
  # A vX.Y.Z-<pre> tag makes a pre-release, which GitHub never makes the
  # latest release: installs and updates follow releases/latest, and the
  # image gets no latest tag for it either.
  prerelease: auto
  # install.sh is what the install host serves; openapi.json is the API
  # reference the docs sync from releases/latest/download/openapi.json.
  extra_files:
    - glob: build/install.sh
    - glob: openapi.json

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^Merge "
