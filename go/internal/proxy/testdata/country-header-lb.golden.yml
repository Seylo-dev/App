# Written by the Seylo agent for service svc12. Rewritten on every change; do not edit.
http:
  routers:
    seylo-svc12-r-r1:
      entryPoints:
        - websecure
      rule: (Host(`shop.example.com`)) && !(Method(`GET`) || Method(`HEAD`) || Method(`OPTIONS`))
      priority: 24
      middlewares:
        - seylo-svc12-country
        - seylo-svc12-unreachable
        - seylo-svc12-resend
      service: seylo-svc12
      tls:
        certResolver: le
    seylo-svc12-r-r1-http:
      entryPoints:
        - web
      rule: Host(`shop.example.com`)
      middlewares:
        - seylo-svc12-https
      service: seylo-svc12
    seylo-svc12-r-r1-lb:
      entryPoints:
        - seylo-lb
      rule: Host(`shop.example.com`)
      middlewares:
        - seylo-svc12-country
        - seylo-svc12-unreachable
      service: seylo-svc12-local
      tls:
        options: seylo-lb
    seylo-svc12-r-r1-origin:
      entryPoints:
        - websecure
      rule: Host(`shop.example.com`) && PathPrefix(`/.well-known/seylo-origin/`)
      priority: 1999998000
      service: seylo-svc12-edge
      tls:
        certResolver: le
    seylo-svc12-r-r1-origin-http:
      entryPoints:
        - web
      rule: Host(`shop.example.com`) && PathPrefix(`/.well-known/seylo-origin/`)
      priority: 1999998000
      service: seylo-svc12-edge
    seylo-svc12-r-r1-retry:
      entryPoints:
        - websecure
      rule: (Host(`shop.example.com`)) && (Method(`GET`) || Method(`HEAD`) || Method(`OPTIONS`))
      priority: 24
      middlewares:
        - seylo-svc12-country
        - seylo-svc12-unreachable
        - seylo-svc12-resend-idem
      service: seylo-svc12
      tls:
        certResolver: le
  middlewares:
    seylo-svc12-country:
      forwardAuth:
        address: http://172.30.0.1:5758/
        trustForwardHeader: true
        authRequestHeaders:
          - Cf-Connecting-Ip
        authResponseHeadersRegex: (?i)^x[^a-z0-9]seylo[^a-z0-9]country$
        maxResponseBodySize: 1024
    seylo-svc12-https:
      redirectScheme:
        scheme: https
        permanent: true
    seylo-svc12-resend:
      retry:
        attempts: 3
    seylo-svc12-resend-idem:
      retry:
        attempts: 3
        status:
          - 502-504
        maxRequestBodyBytes: 1048576
    seylo-svc12-unreachable:
      errors:
        status:
          - "502"
          - "504"
        service: seylo-svc12-edge
        query: /_seylo/page/status/svc12
  services:
    seylo-svc12:
      weighted:
        services:
          - name: seylo-svc12-local
            weight: 1
          - name: seylo-svc12-node-n2
            weight: 1
    seylo-svc12-edge:
      loadBalancer:
        servers:
          - url: http://172.30.0.1:5756
    seylo-svc12-local:
      loadBalancer:
        servers:
          - url: http://seylo-svc12-1:3000
        serversTransport: seylo-svc12-local
    seylo-svc12-node-n2:
      loadBalancer:
        servers:
          - url: https://198.51.100.2:5757
        serversTransport: seylo-svc12-node-n2
  serversTransports:
    seylo-svc12-local:
      forwardingTimeouts:
        dialTimeout: 2s
    seylo-svc12-node-n2:
      serverName: lb.seylo.internal
      rootCAs:
        - |
          -----BEGIN CERTIFICATE-----
          CA
          -----END CERTIFICATE-----
      certificates:
        - certFile: |
            -----BEGIN CERTIFICATE-----
            NODE
            -----END CERTIFICATE-----
          keyFile: |
            -----BEGIN PRIVATE KEY-----
            KEY
            -----END PRIVATE KEY-----
      forwardingTimeouts:
        dialTimeout: 3s
