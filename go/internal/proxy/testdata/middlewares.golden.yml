# Written by the Seylo agent for service svc3. Rewritten on every change; do not edit.
http:
  routers:
    seylo-svc3-r-r1:
      entryPoints:
        - websecure
      rule: Host(`secure.example.com`)
      middlewares:
        - seylo-svc3-r-r1-redirect-0
        - seylo-svc3-r-r1-allow
        - seylo-svc3-r-r1-ratelimit
        - seylo-svc3-r-r1-auth
        - seylo-svc3-unreachable
      service: seylo-svc3
      tls:
        certResolver: le
    seylo-svc3-r-r1-acme-challenge:
      entryPoints:
        - websecure
      rule: Host(`secure.example.com`) && PathPrefix(`/.well-known/acme-challenge/`)
      priority: 1999997000
      service: acme-http@internal
      tls: {}
    seylo-svc3-r-r1-http:
      entryPoints:
        - web
      rule: Host(`secure.example.com`)
      middlewares:
        - seylo-svc3-r-r1-redirect-0
        - seylo-svc3-https
      service: seylo-svc3
    seylo-svc3-r-r1-origin:
      entryPoints:
        - websecure
      rule: Host(`secure.example.com`) && PathPrefix(`/.well-known/seylo-origin/`)
      priority: 1999998000
      service: seylo-svc3-edge
      tls:
        certResolver: le
    seylo-svc3-r-r1-origin-http:
      entryPoints:
        - web
      rule: Host(`secure.example.com`) && PathPrefix(`/.well-known/seylo-origin/`)
      priority: 1999998000
      service: seylo-svc3-edge
  middlewares:
    seylo-svc3-https:
      redirectScheme:
        scheme: https
        permanent: true
    seylo-svc3-r-r1-allow:
      ipAllowList:
        sourceRange:
          - 10.0.0.0/8
          - 203.0.113.7/32
    seylo-svc3-r-r1-auth:
      basicAuth:
        users:
          - ops:$2y$10$abcdefghijklmnopqrstuuJ0bZ5wKkC7b0z1oQbqk3yQ9x8l6YH6a
        realm: Seylo
    seylo-svc3-r-r1-ratelimit:
      rateLimit:
        average: 50
        burst: 100
        period: 1m0s
    seylo-svc3-r-r1-redirect-0:
      redirectRegex:
        regex: ^https?://www\.secure\.example\.com/(.*)
        replacement: https://secure.example.com/${1}
        permanent: true
    seylo-svc3-unreachable:
      errors:
        status:
          - "502"
          - "504"
        service: seylo-svc3-edge
        query: /_seylo/page/status/svc3
  services:
    seylo-svc3:
      loadBalancer:
        servers:
          - url: http://seylo-svc3-1:3000
        serversTransport: seylo-svc3-local
    seylo-svc3-edge:
      loadBalancer:
        servers:
          - url: http://172.30.0.1:5756
    seylo-svc3-local:
      loadBalancer:
        servers:
          - url: http://seylo-svc3-1:3000
        serversTransport: seylo-svc3-local
  serversTransports:
    seylo-svc3-local:
      forwardingTimeouts:
        dialTimeout: 2s
