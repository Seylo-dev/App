http:
  routers:
    seylo-svc8-dbcert:
      entryPoints:
        - websecure
      rule: Host(`db.example.com`)
      priority: 1000000022
      service: noop@internal
      tls:
        certResolver: le
    seylo-svc8-r-r1:
      entryPoints:
        - websecure
      rule: Host(`app.example.com`)
      middlewares:
        - seylo-svc8-unreachable
      service: seylo-svc8
      tls:
        certResolver: le
    seylo-svc8-r-r1-handoff:
      entryPoints:
        - websecure
      rule: Host(`app.example.com`) && Path(`/_seylo/handoff`)
      priority: 1999999000
      service: seylo-svc8-edge
      tls:
        certResolver: le
    seylo-svc8-r-r1-http:
      entryPoints:
        - web
      rule: Host(`app.example.com`)
      middlewares:
        - seylo-svc8-https
      service: seylo-svc8
    seylo-svc8-r-r1-origin:
      entryPoints:
        - websecure
      rule: Host(`app.example.com`) && PathPrefix(`/.well-known/seylo-origin/`)
      priority: 1999998000
      service: seylo-svc8-edge
      tls:
        certResolver: le
    seylo-svc8-r-r1-origin-http:
      entryPoints:
        - web
      rule: Host(`app.example.com`) && PathPrefix(`/.well-known/seylo-origin/`)
      priority: 1999998000
      service: seylo-svc8-edge
  middlewares:
    seylo-svc8-https:
      redirectScheme:
        scheme: https
        permanent: true
    seylo-svc8-unreachable:
      errors:
        status:
          - "502"
          - "504"
        service: seylo-svc8-edge
