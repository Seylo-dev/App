# Written by the Seylo agent for service svc4. Rewritten on every change; do not edit.
http:
  routers:
    seylo-svc4-r-r1:
      entryPoints:
        - websecure
      rule: Host(`corp.example.com`)
      middlewares:
        - seylo-svc4-country-strip
      service: seylo-svc4
      tls: {}
    seylo-svc4-r-r1-http:
      entryPoints:
        - web
      rule: Host(`corp.example.com`)
      middlewares:
        - seylo-svc4-country-strip
      service: seylo-svc4
  middlewares:
    seylo-svc4-country-strip:
      headers:
        customRequestHeaders:
          X-Seylo-Country: ""
          X-Seylo_Country: ""
          X_Seylo-Country: ""
          X_Seylo_Country: ""
  services:
    seylo-svc4:
      loadBalancer:
        servers:
          - url: http://seylo-svc4-2:80
        serversTransport: seylo-svc4-local
    seylo-svc4-local:
      loadBalancer:
        servers:
          - url: http://seylo-svc4-2:80
        serversTransport: seylo-svc4-local
  serversTransports:
    seylo-svc4-local:
      forwardingTimeouts:
        dialTimeout: 2s
tls:
  certificates:
    - certFile: |
        -----BEGIN CERTIFICATE-----
        AAA
        -----END CERTIFICATE-----
      keyFile: |
        -----BEGIN PRIVATE KEY-----
        BBB
        -----END PRIVATE KEY-----
