      rule: PathPrefix(`/_seylo/probe/svc1/e2e69b81a232ce9f`) && Header(`X-Seylo-Probe`, `s3cret`) && ClientIP(`172.30.0.1`)
      priority: 2000000000
      middlewares:
        - seylo-svc1-probe-mark
        - seylo-svc1-probe-path
      service: seylo-svc1-local
    seylo-svc1-r-r1:
      entryPoints:
        - websecure
      rule: ((Host(`app.example.com`) || Host(`www.example.com`))) && !(Method(`GET`) || Method(`HEAD`) || Method(`OPTIONS`))
      priority: 52
      middlewares:
        - seylo-svc1-unreachable
        - seylo-svc1-resend
      service: seylo-svc1
      tls:
        certResolver: le
    seylo-svc1-r-r1-http:
      entryPoints:
        - web
      rule: (Host(`app.example.com`) || Host(`www.example.com`))
      middlewares:
        - seylo-svc1-https
      service: seylo-svc1
    seylo-svc1-r-r1-retry:
