        - websecure
      rule: ((Host(`app.example.com`) || Host(`www.example.com`))) && (Method(`GET`) || Method(`HEAD`) || Method(`OPTIONS`))
      priority: 52
      middlewares:
        - seylo-svc1-unreachable
        - seylo-svc1-resend-idem
      service: seylo-svc1
      tls:
        certResolver: le
  middlewares:
    seylo-svc1-https:
      redirectScheme:
        scheme: https
        permanent: true
    seylo-svc1-probe-mark:
      headers:
        customResponseHeaders:
          X-Seylo-Route: e2e69b81a232ce9f
    seylo-svc1-probe-path:
