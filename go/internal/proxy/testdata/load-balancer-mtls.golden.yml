# Written by the Seylo agent for service svc7. Rewritten on every change; do not edit.
http:
  routers:
    seylo-svc7-r-r1:
      entryPoints:
        - websecure
      rule: (Host(`lb.example.com`)) && !(Method(`GET`) || Method(`HEAD`) || Method(`OPTIONS`))
      priority: 22
      middlewares:
        - seylo-svc7-unreachable
        - seylo-svc7-resend
      service: seylo-svc7
      tls:
        certResolver: le
    seylo-svc7-r-r1-acme-challenge:
      entryPoints:
        - websecure
      rule: Host(`lb.example.com`) && PathPrefix(`/.well-known/acme-challenge/`)
      priority: 1999997000
      service: acme-http@internal
      tls: {}
    seylo-svc7-r-r1-http:
      entryPoints:
        - web
      rule: Host(`lb.example.com`)
      middlewares:
        - seylo-svc7-https
      service: seylo-svc7
    seylo-svc7-r-r1-lb:
      entryPoints:
        - seylo-lb
      rule: Host(`lb.example.com`)
      middlewares:
        - seylo-svc7-unreachable
      service: seylo-svc7-local
      tls:
        options: seylo-lb
    seylo-svc7-r-r1-origin:
      entryPoints:
        - websecure
      rule: Host(`lb.example.com`) && PathPrefix(`/.well-known/seylo-origin/`)
      priority: 1999998000
      service: seylo-svc7-edge
      tls:
        certResolver: le
    seylo-svc7-r-r1-origin-http:
      entryPoints:
        - web
      rule: Host(`lb.example.com`) && PathPrefix(`/.well-known/seylo-origin/`)
      priority: 1999998000
      service: seylo-svc7-edge
    seylo-svc7-r-r1-retry:
      entryPoints:
        - websecure
      rule: (Host(`lb.example.com`)) && (Method(`GET`) || Method(`HEAD`) || Method(`OPTIONS`))
      priority: 22
      middlewares:
        - seylo-svc7-unreachable
        - seylo-svc7-resend-idem
      service: seylo-svc7
      tls:
        certResolver: le
  middlewares:
    seylo-svc7-https:
      redirectScheme:
        scheme: https
        permanent: true
    seylo-svc7-resend:
      retry:
        attempts: 3
    seylo-svc7-resend-idem:
      retry:
        attempts: 3
        status:
          - 502-504
        maxRequestBodyBytes: 1048576
    seylo-svc7-unreachable:
      errors:
        status:
          - "502"
          - "504"
        service: seylo-svc7-edge
        query: /_seylo/page/status/svc7
  services:
    seylo-svc7:
      weighted:
        services:
          - name: seylo-svc7-local
            weight: 1
          - name: seylo-svc7-node-n2
            weight: 1
    seylo-svc7-edge:
      loadBalancer:
        servers:
          - url: http://172.30.0.1:5756
    seylo-svc7-local:
      loadBalancer:
        servers:
          - url: http://seylo-svc7-4:3000
        serversTransport: seylo-svc7-local
    seylo-svc7-node-n2:
      loadBalancer:
        servers:
          - url: https://198.51.100.2:5757
        serversTransport: seylo-svc7-node-n2
  serversTransports:
    seylo-svc7-local:
      forwardingTimeouts:
        dialTimeout: 2s
    seylo-svc7-node-n2:
      serverName: lb.seylo.internal
      rootCAs:
        - |
          -----BEGIN CERTIFICATE-----
          CA
          -----END CERTIFICATE-----
      certificates:
        - certFile: |
            -----BEGIN CERTIFICATE-----
            NODE
            -----END CERTIFICATE-----
          keyFile: |
            -----BEGIN PRIVATE KEY-----
            KEY
            -----END PRIVATE KEY-----
      forwardingTimeouts:
        dialTimeout: 3s
