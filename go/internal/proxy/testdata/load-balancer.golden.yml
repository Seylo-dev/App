http:
  routers:
    seylo-svc7-r-r1:
      entryPoints:
        - websecure
      rule: (Host(`lb.example.com`)) && !(Method(`GET`) || Method(`HEAD`) || Method(`OPTIONS`))
      priority: 22
      middlewares:
        - seylo-svc7-unreachable
        - seylo-svc7-resend
      service: seylo-svc7
      tls:
        certResolver: le
    seylo-svc7-r-r1-http:
      entryPoints:
        - web
      rule: Host(`lb.example.com`)
      middlewares:
        - seylo-svc7-https
      service: seylo-svc7
    seylo-svc7-r-r1-lb:
      entryPoints:
        - seylo-lb
      rule: Host(`lb.example.com`)
      middlewares:
        - seylo-svc7-unreachable
      service: seylo-svc7-local
      tls:
        options: seylo-lb
    seylo-svc7-r-r1-origin:
      entryPoints:
        - websecure
      rule: Host(`lb.example.com`) && PathPrefix(`/.well-known/seylo-origin/`)
      priority: 1999998000
      service: seylo-svc7-edge
      tls:
        certResolver: le
    seylo-svc7-r-r1-origin-http:
      entryPoints:
        - web
      rule: Host(`lb.example.com`) && PathPrefix(`/.well-known/seylo-origin/`)
      priority: 1999998000
      service: seylo-svc7-edge
    seylo-svc7-r-r1-retry:
      entryPoints:
        - websecure
      rule: (Host(`lb.example.com`)) && (Method(`GET`) || Method(`HEAD`) || Method(`OPTIONS`))
      priority: 22
      middlewares:
        - seylo-svc7-unreachable
        - seylo-svc7-resend
      service: seylo-svc7-retry
      tls:
        certResolver: le
  middlewares:
    seylo-svc7-https:
      redirectScheme:
        scheme: https
        permanent: true
    seylo-svc7-resend:
      retry:
        attempts: 3
    seylo-svc7-unreachable:
      errors:
        status:
          - "502"
          - "504"
        service: seylo-svc7-edge
        query: /_seylo/page/status/svc7
