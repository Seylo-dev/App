    seylo-svc7:
      weighted:
        services:
          - name: seylo-svc7-local
            weight: 1
          - name: seylo-svc7-node-n2
            weight: 1
        sticky:
          cookie:
            name: seylo_svc7
            secure: true
            httpOnly: true
            sameSite: lax
    seylo-svc7-edge:
      loadBalancer:
        servers:
          - url: http://172.30.0.1:5756
    seylo-svc7-fallback:
      failover:
        service: seylo-svc7-local
        fallback: seylo-svc7-node-n2
        errors:
          status:
            - 502-504
          maxRequestBodyBytes: 1048576
    seylo-svc7-local:
      loadBalancer:
        servers:
          - url: http://seylo-svc7-4:3000
        sticky:
          cookie:
            name: seylo_svc7_r
            secure: true
            httpOnly: true
            sameSite: lax
        serversTransport: seylo-svc7-local
    seylo-svc7-node-n2:
      loadBalancer:
        servers:
          - url: https://198.51.100.2:5757
        serversTransport: seylo-svc7-node-n2
    seylo-svc7-retry:
