name: Release

# A pushed v* tag makes a GitHub release in four jobs:
#
# - Build and test: tests the tagged commit and builds the web app and the
#   panel (`make build-ts`: apps/web/dist and apps/panel/dist). It runs
#   every npm package of the build and the tests, so its token can only
#   read and it gets no secret. It hands the build to the next job as an
#   artifact.
# - Draft release: gets that build as files and runs no npm package:
#   `make release-draft` builds the Go binaries, checksums.txt, install.sh,
#   openapi.json, the multi-arch panel image on ghcr.io (which only packages
#   the built files) and manifest.json, as a DRAFT release with nothing
#   signed. It holds the token that writes releases and packages, and never
#   the release key.
# - Sign: the only job that sees the release key (MINISIGN_SECRET_KEY and
#   MINISIGN_PASSWORD of the "release" environment). It gets the built files
#   as an artifact, runs no npm, bun or goreleaser code, checks the files,
#   signs checksums.txt and manifest.json with minisign
#   (scripts/release-sign.sh) and attaches the signatures to the draft.
# - Publish: checks the draft on its own (signatures against brand.json's
#   key, files, versions, an anonymous pull of the panel image) and publishes
#   it only when every check passes; otherwise the draft stays and the run
#   summary says what to do (CONTRIBUTING.md, Releases).
#
# scripts/check-release-workflow.ts (make test-release) fails when a job
# that holds a write token or a secret runs bun, npm or node, or when
# goreleaser's hooks do.
#
# Run by hand (workflow_dispatch) it is a dry run that publishes nothing: the
# same Build and test job, goreleaser in snapshot mode on its build, the
# signing script in its own job with a throwaway key made there, and no
# secrets. Real releases only come from tags.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run, publishes nothing (real releases only come from a pushed v* tag)
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # .goreleaser.yaml uses dockers_v2 (goreleaser 2.12 or later). Keep this in
  # step with the goreleaser used for `make release` and `make release-check`.
  GORELEASER_VERSION: v2.20.0
  # Pinned like the actions: the arm64 emulator and the BuildKit that builds
  # the panel image.
  BINFMT_IMAGE: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
  BUILDKIT_IMAGE: moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

jobs:
  refuse:
    name: Refuse a dispatched release
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Real releases only come from a pushed v* tag
        run: |
          echo "::error::A run started by hand is always a dry run. Release by pushing a v* tag (CONTRIBUTING.md, Releases)."
          exit 1

  build:
    name: Build and test
    # A pushed v* tag, or a dry run started by hand.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # This job runs every npm package of the build and the tests (make
    # install, make test, make build-ts), so its token only reads and it gets
    # no secret: a bad dependency can spoil the build, which the jobs after
    # it package, but it cannot write to the repository, its releases or
    # ghcr.io. Keep it that way (scripts/check-release-workflow.ts).
    permissions:
      contents: read
    concurrency:
      # Dry runs of one ref replace each other; a tag's build is never cancelled.
      group: release-build-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          check-latest: true # the newest 1.27.x, as the release jobs build with
          cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true

      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: 1.75.0
          setup_only: true

      # minisign, dash and jq are for the installer and release script tests.
      - name: Release tools
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends minisign dash jq

      - run: make install
      - run: make check-gen
      - run: make test

      - name: Tree is clean
        # A real release stops here too: goreleaser refuses a dirty tree.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::the checks left changes in the tree; goreleaser would refuse to release"
            exit 1
          fi

      # The web app and the panel, which the panel image packages
      # (deploy/panel.Dockerfile compiles nothing).
      - run: make build-ts

      - name: The build changed no tracked file
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::make build-ts changed tracked files; the release would not be built from the tagged tree"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panel-build
          path: |
            apps/web/dist/
            apps/panel/dist/
          if-no-files-found: error
          retention-days: 14 # a failed Draft release job may be re-run later

  dry-run:
    name: "Dry run: package (publishes nothing)"
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    concurrency:
      group: release-dry-run-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      version: ${{ steps.manifest.outputs.version }}
    # As the Draft release job: no bun, no npm package, the build from the
    # Build and test job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser reads tags and the changelog from history
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          check-latest: true # the newest 1.27.x: a release ships its stdlib
          cache: false

      # apps/web/dist and apps/panel/dist (the artifact's root is apps/).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: panel-build
          path: apps

      - name: Preflight, as the Draft release job runs it (no secret key)
        run: |
          set -a && . installer/brand.env && set +a
          scripts/release-preflight.sh --no-secret-key

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64
          cache-image: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
          cache-binary: false

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true

      - name: goreleaser in snapshot mode (builds everything, signs and pushes nothing)
        run: make release-dry-run

      - name: Panel images
        # A snapshot builds one image per platform, tagged <version>-<arch>,
        # and loads them into the local Docker instead of pushing an index.
        run: |
          set -a && . installer/brand.env && set +a
          version=$(jq -r .version dist/metadata.json)
          for arch in amd64 arm64; do
            image="$BRAND_IMAGE:$version-$arch"
            platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")
            if [ "$platform" != "linux/$arch" ]; then
              echo "::error::$image is $platform, want linux/$arch"
              exit 1
            fi
            echo "$image: $platform"
          done
          {
            echo "### Dry run of $version - nothing was published"
            echo
            echo "Panel images (built per platform, not pushed):"
            echo
            echo '```'
            docker image ls --format '{{.Repository}}:{{.Tag}} {{.ID}}' "$BRAND_IMAGE"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Manifest and the release files (not uploaded)
        id: manifest
        # The local amd64 image's id stands in for the pushed index digest,
        # so the manifest step needs no registry.
        env:
          DRY_RUN: "1"
        run: |
          set -a && . installer/brand.env && set +a
          version=$(jq -r .version dist/metadata.json)
          PANEL_DIGEST=$(docker image inspect --format '{{.Id}}' "$BRAND_IMAGE:$version-amd64")
          export PANEL_DIGEST
          scripts/release-manifest.sh
          echo "version=$version" >>"$GITHUB_OUTPUT"

      # What the Draft release job hands to the Sign job.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dry-run-release-files
          path: dist/release/
          if-no-files-found: error
          retention-days: 1

  dry-run-sign:
    name: "Dry run: sign with a throwaway key"
    needs: dry-run
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release tools
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends minisign jq

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dry-run-release-files
          path: ${{ runner.temp }}/release-files

      - name: Throwaway signing key
        run: |
          umask 077
          dir="$RUNNER_TEMP/dry-run-key"
          mkdir "$dir"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          printf '%s\n%s\n' "$password" "$password" | minisign -G -p "$dir/key.pub" -s "$dir/key" >/dev/null
          echo "MINISIGN_PASSWORD=$password" >>"$GITHUB_ENV"
          echo "DRY_RUN_PUBLIC_KEY=$(sed -n 2p "$dir/key.pub")" >>"$GITHUB_ENV"

      - name: Sign, with the throwaway key standing in for brand.json's
        env:
          MINISIGN_SECRET_KEY: ${{ runner.temp }}/dry-run-key/key
          VERSION: ${{ needs.dry-run.outputs.version }}
        run: |
          set -a && . installer/brand.env && set +a
          export BRAND_MINISIGN_PUBLIC_KEY=$DRY_RUN_PUBLIC_KEY
          scripts/release-sign.sh sign "$VERSION" "$RUNNER_TEMP/release-files"

      - name: Remove the throwaway key
        if: always()
        run: rm -rf "$RUNNER_TEMP/dry-run-key"

      - name: Check what a release would attach
        env:
          VERSION: ${{ needs.dry-run.outputs.version }}
        run: |
          set -a && . installer/brand.env && set +a
          files="$RUNNER_TEMP/release-files"
          for f in checksums.txt manifest.json; do
            out=$(minisign -Vm "$files/$f" -P "$DRY_RUN_PUBLIC_KEY")
            echo "$out"
            if ! grep -qxF "Trusted comment: $BRAND_SLUG $VERSION $f" <<<"$out"; then
              echo "::error::the signature of $f has an unexpected trusted comment"
              exit 1
            fi
          done
          # checksums.txt covers every file but the signed ones, as the
          # Publish job requires: the binaries, install.sh and openapi.json.
          (cd "$files" && sha256sum --strict -c checksums.txt)
          for f in "${BRAND_SLUG}_linux_amd64" "${BRAND_SLUG}_linux_arm64" "${BRAND_SLUG}_darwin_amd64" \
            "${BRAND_SLUG}_darwin_arm64" "${BRAND_SLUG}_windows_amd64.exe" "${BRAND_SLUG}_windows_arm64.exe" \
            install.sh openapi.json; do
            awk -v n="$f" '$2 == n { found = 1 } END { exit !found }' "$files/checksums.txt" ||
              { echo "::error::checksums.txt does not list $f"; exit 1; }
          done
          for f in "${BRAND_SLUG}_linux_amd64" "${BRAND_SLUG}_linux_arm64" "${BRAND_SLUG}_darwin_amd64" \
            "${BRAND_SLUG}_darwin_arm64" "${BRAND_SLUG}_windows_amd64.exe" "${BRAND_SLUG}_windows_arm64.exe" \
            checksums.txt checksums.txt.minisig install.sh openapi.json manifest.json manifest.json.minisig; do
            [ -s "$files/$f" ] || { echo "::error::$f is missing"; exit 1; }
          done
          {
            echo "### Dry run of $VERSION: the files a tag release would attach"
            echo
            echo "Signed in this job with a throwaway key made here; the build job never had a key."
            echo
            echo '```'
            (cd "$files" && ls -l)
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  release:
    name: Draft release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The token that writes releases and ghcr.io packages, so this job runs
    # no npm package: no bun, no make install or make test. The web app and
    # the panel come from the Build and test job as files, which goreleaser
    # only copies into the panel image, and goreleaser's before hook only
    # renders install.sh (scripts/check-release-workflow.ts keeps it so).
    permissions:
      contents: write # the draft release and its files
      packages: write # the panel image on ghcr.io
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser reads tags and the changelog from history
          persist-credentials: false

      - name: Tag is a release version on this commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a vMAJOR.MINOR.PATCH[-PRERELEASE] tag"
            exit 1
          fi
          # make release-draft passes the tag to goreleaser
          # (GORELEASER_CURRENT_TAG), so other tags on the commit (an rc being
          # promoted) do not matter.
          if ! git tag --points-at HEAD | grep -qxF "$TAG"; then
            echo "::error::$TAG does not point at the checked-out commit"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          check-latest: true # the newest 1.27.x: a release ships its stdlib
          cache: false

      # apps/web/dist and apps/panel/dist from the Build and test job (the
      # artifact's root is apps/). Data here: nothing in them runs.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: panel-build
          path: apps

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64
          cache-image: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
          cache-binary: false

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true

      # Preflight (without the secret key), goreleaser (draft release, image
      # push) on the downloaded build, manifest.json, and dist/release/ for
      # the Sign job.
      - name: make release-draft
        env:
          # Release exactly the pushed tag, not the highest tag on the commit.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make release-draft

      - name: Check the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -a && . installer/brand.env && set +a
          version=$(jq -r .version dist/metadata.json)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::goreleaser released $version, not $TAG"
            exit 1
          fi
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          [ "$draft" = true ] || { echo "::error::release $TAG is not a draft"; exit 1; }
          # A pre-release tag must make a pre-release, or publishing it would
          # make it the latest release that installs and updates follow.
          want=false
          [[ "$TAG" == *-* ]] && want=true
          prerelease=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)
          [ "$prerelease" = "$want" ] || { echo "::error::release $TAG has isPrerelease=$prerelease, want $want"; exit 1; }
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          # The signatures come from the Sign job.
          for f in "${BRAND_SLUG}_linux_amd64" "${BRAND_SLUG}_linux_arm64" "${BRAND_SLUG}_darwin_amd64" \
            "${BRAND_SLUG}_darwin_arm64" "${BRAND_SLUG}_windows_amd64.exe" "${BRAND_SLUG}_windows_arm64.exe" \
            checksums.txt install.sh openapi.json manifest.json; do
            grep -qxF "$f" <<<"$assets" || { echo "::error::the draft has no $f"; exit 1; }
            [ -s "dist/release/$f" ] || { echo "::error::dist/release has no $f for the Sign job"; exit 1; }
          done
          {
            echo "### Draft release $TAG (not signed yet)"
            echo
            echo "The Sign job signs it, then the Publish job checks it again and publishes it: https://github.com/$GITHUB_REPOSITORY/releases"
            echo
            echo '```'
            echo "$assets"
            docker buildx imagetools inspect "$BRAND_IMAGE:$version"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # The files the Sign job checks and signs. It treats them as data: it
      # hashes and signs them and never runs them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/release/
          if-no-files-found: error
          retention-days: 14 # the Sign job may wait for a reviewer

  sign:
    name: Sign
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # MINISIGN_SECRET_KEY and MINISIGN_PASSWORD live in this environment only,
    # with required reviewers and v* tags as its only deployment refs
    # (CONTRIBUTING.md, Releases). No other job can read them.
    environment: release
    permissions:
      contents: write # attach the signatures to the draft
    concurrency:
      group: release-sign-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # The tag's own scripts and installer/brand.env; nothing is built or
      # installed from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release secrets are set
        env:
          KEY_SET: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
          PASSWORD_SET: ${{ secrets.MINISIGN_PASSWORD != '' }}
        run: |
          missing=0
          if [ "$KEY_SET" != true ]; then
            echo "::error::the release environment has no MINISIGN_SECRET_KEY secret (CONTRIBUTING.md, Releases)"
            missing=1
          fi
          if [ "$PASSWORD_SET" != true ]; then
            echo "::error::the release environment has no MINISIGN_PASSWORD secret (CONTRIBUTING.md, Releases)"
            missing=1
          fi
          exit "$missing"

      # Only minisign (jq and gh come with the runner image): no npm, bun or
      # goreleaser runs in this job.
      - name: Release tools
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends minisign jq

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files

      - name: Signing key
        env:
          RELEASE_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          umask 077
          printf '%s\n' "$RELEASE_KEY" | tr -d '\r' >"$RUNNER_TEMP/release.key"

      # Checks the files (checksums, manifest, install.sh), signs
      # checksums.txt and manifest.json, and verifies both signatures with
      # brand.json's key.
      - name: Sign checksums.txt and manifest.json
        env:
          TAG: ${{ github.ref_name }}
          MINISIGN_SECRET_KEY: ${{ runner.temp }}/release.key
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -a && . installer/brand.env && set +a
          scripts/release-sign.sh sign "${TAG#v}" "$RUNNER_TEMP/release-files"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.key"

      - name: Attach the signatures to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -a && . installer/brand.env && set +a
          scripts/release-sign.sh upload "$TAG" "$RUNNER_TEMP/release-files"
          {
            echo "### Signed $TAG"
            echo
            echo "checksums.txt and manifest.json are signed and attached to the draft; the Publish job checks it again."
          } >>"$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish
    needs: sign
    # After the Sign job of a pushed v* tag succeeded. Re-running only this
    # job (Actions > the run > Publish > Re-run, say after making the package
    # public) checks the draft again and publishes it; it needs nothing from
    # the other jobs but the release itself.
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # read the draft release and publish it; the image check is anonymous
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # minisign verifies the signatures; gh and curl come with the runner.
      - name: Release tools
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends minisign jq

      # Signatures against brand.json's key, every file and its signed
      # sha256, the manifest and install.sh versions, the pre-release flag,
      # an anonymous pull of the panel image; then publish. The step summary
      # lists each check, or says what to do when one fails.
      - name: Check the draft and publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: scripts/release-publish.sh "$TAG"
