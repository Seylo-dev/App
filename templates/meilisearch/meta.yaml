name: "Meilisearch"
description: "Fast, typo-tolerant search engine with a simple REST API."
category: "Search"
tags: ["search", "api"]
creates: "App"
links:
  - label: "Website"
    url: "https://www.meilisearch.com"
  - label: "Docs"
    url: "https://www.meilisearch.com/docs"
body: |
  Meilisearch runs in production mode, so every request needs the master key (or a key made from it).
schema:
  type: object
  required: ["image"]
  properties:
    image:
      type: "string"
      title: "Image"
      description: "Docker image and tag to run."
      default: "getmeili/meilisearch:v1.12.3"
    masterKey:
      type: "string"
      format: "password"
      title: "Master key"
      description: "At least 16 characters. Generated when left empty."
