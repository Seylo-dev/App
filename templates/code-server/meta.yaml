name: "code-server"
description: "VS Code in the browser, running on your server."
category: "Developer tools"
tags: ["ide", "vscode", "editor"]
creates: "App"
links:
  - label: "Repository"
    url: "https://github.com/coder/code-server"
  - label: "Docs"
    url: "https://coder.com/docs/code-server"
body: |
  Sign in with the password below. The home folder is kept in a volume. For a workspace that sleeps when idle, use a Box instead.
schema:
  type: object
  required: ["image"]
  properties:
    image:
      type: "string"
      title: "Image"
      description: "Docker image and tag to run."
      default: "codercom/code-server:4.96.4"
    password:
      type: "string"
      format: "password"
      title: "Password"
      description: "Generated when left empty."
