name: "File Browser"
description: "Upload, download, share and edit files in a web interface."
category: "Storage"
tags: ["files", "storage", "sharing"]
creates: "App"
links:
  - label: "Website"
    url: "https://filebrowser.org"
  - label: "Repository"
    url: "https://github.com/filebrowser/filebrowser"
body: |
  Files are kept in the `files` volume and File Browser's settings in `config`.
  The first sign-in is user `admin` with password `admin`: change it right away.
schema:
  type: object
  required: ["image"]
  properties:
    image:
      type: "string"
      title: "Image"
      description: "Docker image and tag to run."
      default: "filebrowser/filebrowser:v2.32.0"
