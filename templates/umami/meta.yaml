name: "Umami"
description: "Simple, privacy-friendly website analytics without cookies."
category: "Analytics"
tags: ["analytics", "privacy"]
creates: "App + Postgres"
links:
  - label: "Website"
    url: "https://umami.is"
  - label: "Docs"
    url: "https://umami.is/docs"
body: |
  Umami tracks page views without cookies and keeps the data in your own Postgres.
  The first sign-in is user `admin` with password `umami`: change it right away.
schema:
  type: object
  required: ["image"]
  properties:
    image:
      type: "string"
      title: "Image"
      description: "Docker image and tag to run."
      default: "ghcr.io/umami-software/umami:postgresql-v2.15.1"
