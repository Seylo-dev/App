name: "Redis Insight"
description: "Visual browser and profiler for Redis, with a Redis to start with."
category: "Databases"
tags: ["redis", "database", "gui"]
creates: "App + Redis"
links:
  - label: "Website"
    url: "https://redis.io/insight"
  - label: "Docs"
    url: "https://redis.io/docs/latest/develop/tools/insight"
body: |
  Redis Insight browses keys, runs commands and profiles Redis. The template adds a Redis service;
  add it in Redis Insight with host and password from its Connection tab.
schema:
  type: object
  required: ["image"]
  properties:
    image:
      type: "string"
      title: "Image"
      description: "Docker image and tag to run."
      default: "redis/redisinsight:2.64.0"
    withRedis:
      type: "boolean"
      title: "Add a Redis"
      default: true
