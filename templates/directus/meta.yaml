name: "Directus"
description: "Instant REST and GraphQL API with a no-code app for any SQL database."
category: "CMS"
tags: ["headless-cms", "api", "data"]
creates: "App + Postgres"
links:
  - label: "Website"
    url: "https://directus.io"
  - label: "Docs"
    url: "https://docs.directus.io"
body: |
  Directus creates the admin account from the email and password below on its first start.
schema:
  type: object
  required: ["image", "adminEmail"]
  properties:
    image:
      type: "string"
      title: "Image"
      description: "Docker image and tag to run."
      default: "directus/directus:11.4.0"
    adminEmail:
      type: "string"
      title: "Admin email"
    adminPassword:
      type: "string"
      format: "password"
      title: "Admin password"
      description: "Generated when left empty."
