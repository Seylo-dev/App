name: "n8n"
description: "Workflow automation with a visual editor and hundreds of integrations."
category: "Automation"
tags: ["automation", "workflows", "low-code"]
creates: "App + Postgres"
links:
  - label: "Website"
    url: "https://n8n.io"
  - label: "Docs"
    url: "https://docs.n8n.io"
body: |
  n8n connects APIs and services with visual workflows. It stores workflows and credentials in Postgres.
  Open the app after the first deploy to create the owner account.
schema:
  type: object
  required: ["image"]
  properties:
    image:
      type: "string"
      title: "Image"
      description: "Docker image and tag to run."
      default: "n8nio/n8n:1.80.0"
    timezone:
      type: "string"
      title: "Time zone"
      description: "IANA zone for schedules."
      default: "UTC"
