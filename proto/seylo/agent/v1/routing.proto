syntax = "proto3";

package seylo.agent.v1;

import "google/protobuf/duration.proto";

// Routing is everything that decides how HTTP traffic reaches a service.
// The agent renders it into a seylo-<service>.yml Traefik file and swaps the
// file atomically during deploys.
message Routing {
  repeated Route routes = 1;
  // Per-service maintenance page. NodeSettings has the global one.
  Maintenance maintenance = 2;
  // Page shown while no instance is healthy (stopped, crashed, deploying
  // for the first time).
  StatusPage status_page = 3;
}

// Route maps hosts (and optionally a path) to a container port.
message Route {
  // Stable id from the panel, used in Traefik router names.
  string id = 1;
  // One or more host names, for example "app.example.com" or the auto
  // domain "<svc>.<node wildcard>".
  repeated string hosts = 2;
  // Only requests under this prefix match. Empty means the whole host.
  string path_prefix = 3;
  // Remove path_prefix before forwarding.
  bool strip_prefix = 4;
  uint32 target_port = 5;
  HttpsMode https = 6;
  // Required with HTTPS_MODE_CUSTOM_CERTIFICATE.
  Certificate certificate = 7;
  // Redirect plain HTTP to HTTPS. Ignored with HTTPS_MODE_OFF.
  bool redirect_to_https = 8;
  repeated Redirect redirects = 9;
  BasicAuth basic_auth = 10;
  // Empty means every source address is allowed.
  repeated string allowed_source_cidrs = 11;
  RateLimit rate_limit = 12;
  // With HTTPS_MODE_ACME: do not ask the CA yet. The panel holds the
  // certificate back until it has seen the host reach a node of the
  // service (apps/panel/src/modules/domains/acme-hold.ts), since every
  // failed attempt counts against Let's Encrypt's 5 failed validations per
  // host name per hour. Meanwhile the route serves plain HTTP without the
  // redirect, and HTTPS with Traefik's default certificate and no
  // certificate resolver, so the panel's origin check also reaches the
  // node when Cloudflare's proxy connects to it on 443 (Always Use HTTPS,
  // SSL/TLS Full). redirect_to_https is ignored. false asks the CA at once;
  // an agent from before 0.2.8 ignores it and does the same.
  bool acme_hold = 13;
  // With HTTPS_MODE_ACME: answer Let's Encrypt's HTTP-01 challenge
  // (/.well-known/acme-challenge/) on HTTPS too, with Traefik's own
  // handler, since 0.2.12. Traefik answers it on plain HTTP by itself, which
  // is enough when the host's DNS points straight at the node. In front of
  // the node, a redirect to https that takes every path (a Cloudflare
  // Redirect Rule or Page Rule; Cloudflare's Always Use HTTPS itself leaves
  // the challenge path alone) sends the CA's http:// request to https and,
  // with SSL/TLS Full, to port 443; the CA follows the redirect without
  // checking the certificate. While
  // set, https requests for that path never reach the app: Traefik answers
  // the tokens of its own orders and 404 for the rest. The panel sets it
  // unless the domain's last DNS check saw it point straight at the node
  // (apps/panel/src/modules/domains/acme-hold.ts acmeChallengeOnHttps), so
  // an app there keeps the path on 443. false, or an agent from before
  // 0.2.12, answers the challenge on plain HTTP only, as before.
  bool acme_challenge_on_https = 14;
}

enum HttpsMode {
  HTTPS_MODE_UNSPECIFIED = 0;
  HTTPS_MODE_OFF = 1;
  // Let's Encrypt certificate per host via HTTP-01. The default.
  HTTPS_MODE_ACME = 2;
  HTTPS_MODE_CUSTOM_CERTIFICATE = 3;
}

message Certificate {
  string cert_pem = 1;
  string key_pem = 2;
}

// Redirect rewrites matching request URLs, for example www to apex.
message Redirect {
  // RE2 regular expression matched against the full request URL.
  string from = 1;
  // Replacement, may use $1-style groups.
  string to = 2;
  // 308 when true, 307 otherwise.
  bool permanent = 3;
}

message BasicAuth {
  repeated BasicAuthUser users = 1;
}

message BasicAuthUser {
  string username = 1;
  // bcrypt hash; plaintext passwords never reach the agent.
  string password_hash = 2;
}

message RateLimit {
  // Average allowed requests per period, per source IP.
  uint32 average = 1;
  uint32 burst = 2;
  // Default 1s.
  google.protobuf.Duration period = 3;
}

message Maintenance {
  bool enabled = 1;
  // Custom page. Empty uses the default page.
  string html = 2;
}

message StatusPage {
  bool enabled = 1;
  // Custom page. Empty uses the default page.
  string html = 2;
}
