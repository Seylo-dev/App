syntax = "proto3";

package seylo.agent.v1;

import "seylo/agent/v1/node.proto";

// Handshake is the payload of EVENT frames on stream 0 until the panel
// accepts the session. The order is fixed:
//
//   panel -> agent  ServerHello
//   agent -> panel  ClientHello
//   panel -> agent  HelloAccepted or HelloRejected (then the panel closes)
//
// Transport security comes from TLS. Until the panel has a public
// certificate, the join command carries the panel certificate's SPKI
// SHA-256 pin and the agent stores it in config.yml.
message Handshake {
  oneof step {
    ServerHello server_hello = 1;
    ClientHello client_hello = 2;
    HelloAccepted accepted = 3;
    HelloRejected rejected = 4;
  }
}

message ServerHello {
  // Stable id of this panel installation.
  string panel_id = 1;
  string panel_version = 2;
  // 32 random bytes, fresh for every connection. The agent signs it.
  bytes nonce = 3;
  // Capability strings the panel understands, see NodeFacts.capabilities.
  repeated string capabilities = 4;
}

// ClientHello proves the agent's identity. The signature is Ed25519 over
//
//   "seylo-agent-hello-v1" 0x00 panel_id 0x00 node_id 0x00 nonce
//
// where node_id is empty when joining. Binding panel_id stops a signature
// for one panel from being replayed to another.
message ClientHello {
  string agent_version = 1;
  NodeFacts facts = 2;
  oneof credential {
    JoinCredential join = 3;
    ResumeCredential resume = 4;
  }
}

// JoinCredential is used once: the first connection of a new node.
message JoinCredential {
  // Single-use join token, valid for one hour, from the panel's "Add node".
  string token = 1;
  // Ed25519 public key generated by the agent; its private key never
  // leaves /var/lib/seylo.
  bytes public_key = 2;
  // Signature as described on ClientHello.
  bytes signature = 3;
  // Display name proposed for the node (defaults to the hostname).
  string requested_name = 4;
}

// ResumeCredential is used on every later connection.
message ResumeCredential {
  string node_id = 1;
  // Signature as described on ClientHello.
  bytes signature = 2;
}

message HelloAccepted {
  string node_id = 1;
  // Unique per connection, used in logs on both sides.
  string session_id = 2;
  // Ed25519 public key the agent uses to verify panel-signed edge tickets
  // (DB UI, Box, status pages) locally, without a round trip.
  bytes edge_ticket_public_key = 3;
  // Where the panel wants this agent to connect from now on, as a base URL
  // like "https://panel.example.com" (no path). The panel sets it on every
  // connect once it has a domain with a working HTTPS certificate, so nodes
  // that joined over an IP address move to the domain. Empty means keep the
  // current address. The panel's own node keeps dialing loopback and never
  // gets it. Agents move only to https:// URLs, and only after a full
  // handshake at the new address succeeded; a failed move keeps the old
  // address and raises NODE_ALERT_KIND_PANEL_MOVE_FAILED. Agents from
  // before this field ignore it.
  string panel_url = 4;
  // Pin for panel_url: "sha256:<64 hex>" of the certificate's SPKI, as in
  // the join command's --pin. Empty means verify panel_url's certificate
  // with the node's system CA roots (a public certificate).
  string panel_pin = 5;
  // The panel's proof that it holds its identity key, the private half of
  // edge_ticket_public_key: Ed25519 over
  //
  //   "seylo-panel-accept-v1" 0x00 panel_id 0x00 node_id 0x00 session_id
  //   0x00 nonce 0x00 client_signature 0x00 panel_url 0x00 panel_pin
  //
  // with panel_id and nonce from the ServerHello, node_id, session_id,
  // panel_url and panel_pin from this message, and client_signature the
  // ClientHello's join or resume signature (so it is fresh for every
  // connection). Agents record panel_id and edge_ticket_public_key at
  // their first accepted handshake and refuse a panel that names others;
  // once they saw a valid panel_signature they require one on every
  // connect, so a certificate for the panel's domain alone no longer makes
  // a panel. Added in 0.2; older agents ignore it.
  bytes panel_signature = 6;
}

message HelloRejected {
  HelloRejectReason reason = 1;
  string message = 2;
  // Set with HELLO_REJECT_REASON_AGENT_TOO_OLD: the minimum version the
  // panel accepts. The agent updates itself before reconnecting.
  string min_agent_version = 3;
}

enum HelloRejectReason {
  HELLO_REJECT_REASON_UNSPECIFIED = 0;
  HELLO_REJECT_REASON_INVALID_TOKEN = 1;
  HELLO_REJECT_REASON_TOKEN_EXPIRED = 2;
  HELLO_REJECT_REASON_UNKNOWN_NODE = 3;
  HELLO_REJECT_REASON_BAD_SIGNATURE = 4;
  HELLO_REJECT_REASON_AGENT_TOO_OLD = 5;
  HELLO_REJECT_REASON_NODE_DISABLED = 6;
  // Another live connection already holds this node id.
  HELLO_REJECT_REASON_ALREADY_CONNECTED = 7;
}
