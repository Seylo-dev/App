syntax = "proto3";

package seylo.agent.v1;

import "google/protobuf/timestamp.proto";
import "seylo/agent/v1/tailnet.proto";

// NodeFacts describes a node. The agent sends it in ClientHello and
// whenever it changes (GetNodeFacts returns the current value).
message NodeFacts {
  string hostname = 1;
  // For example "ubuntu 24.04".
  string os = 2;
  string kernel = 3;
  // GOARCH spelling: "amd64", "arm64".
  string arch = 4;
  uint32 cpu_cores = 5;
  uint64 memory_total_bytes = 6;
  // Size and free space of the file system holding the data dir.
  uint64 disk_total_bytes = 7;
  uint64 disk_free_bytes = 8;
  string docker_version = 9;
  string docker_api_version = 10;
  // 1 or 2.
  uint32 cgroup_version = 11;
  string public_ipv4 = 12;
  string public_ipv6 = 13;
  google.protobuf.Timestamp boot_time = 14;
  string agent_version = 15;
  // Capability strings this agent supports, named "<area>.<feature>.v<n>",
  // for example "fs.archive.v1". The panel only calls methods whose
  // capability (the `capability` method option in options.proto) the agent
  // advertised, which is how new RPCs roll out to a fleet of mixed versions.
  repeated string capabilities = 16;
  // Present when Pelican Wings runs on this node.
  WingsInfo wings = 17;
  // The node's config.yml "can_build" (`seylo join --can-build`). Reported
  // only: since 0.2.1 the panel decides which nodes build (the join
  // command's "Build images on this node" choice, later nodes.setCanBuild)
  // and sends max_parallel_builds 0 to the others. A re-join never changes
  // a known node's value. changed in 0.2.1 (build default)
  bool can_build = 18;
  // The node's private IPv4: the local address it reaches the panel from,
  // or its default-route address when the panel is on the same host. Empty
  // when that address is public (then it is public_ipv4) or unknown. The
  // panel falls back to it for node addresses when public_ipv4 is empty
  // (nodes that share one private network).
  string private_ipv4 = 19;
  // IANA name of the node's own time zone (/etc/localtime, else TZ), for
  // example "Europe/Berlin"; "UTC" when the machine names none. Scheduled
  // cleanup runs in it. added in 0.2 (nodeops)
  string time_zone = 20;
  // The public addresses on the node's own interfaces (what netguard
  // counts as public; internal ones are left out), sorted, at most 64 of
  // each family. The agent refuses git connections to them like internal
  // addresses unless the panel allows internal addresses for the source's
  // host (GitSource.allow_internal_host). The panel counts a git host whose
  // every address is a node's address as internal where an admin stands
  // behind the outcome (an admin's save records it, a provider connection,
  // the upgrade seed), never to refuse a member: an agent can report any
  // address. Empty from agents before this field. added in 0.2 (security)
  repeated string interface_addresses = 21;
  // docker buildx on this node, checked at agent start, every 30 minutes,
  // every minute while the panel sends builds and it is missing, and at
  // once when the panel turns builds on. Unset from older agents: the
  // panel counts the node as able to build, as before. With installed
  // false the panel picks no automatic builds for this node and refuses it
  // as an explicit build node. added in 0.2.1 (build default)
  BuildxInfo buildx = 22;
  // The tailscaled on this node's host, as the agent reads it over its
  // LocalAPI socket. Unset when there is no tailscaled socket, and from
  // agents before 0.2.1. added in 0.2.1 (tailnet)
  TailscaleInfo tailscale = 23;
  // The agent's own check for a newer Docker Engine (DockerUpdateInfo).
  // Agents that make it advertise node.docker-check.v1. Unset until the
  // first check after an agent start, and from older agents: the panel then
  // shows no update information. added in 0.2.5 (docker check)
  DockerUpdateInfo docker_update = 24;
}

// DockerUpdateInfo is what the agent found when it last looked for a newer
// Docker Engine: the plan of UpdateDocker's dry run (apt refreshes its
// package lists first), upgrading nothing. It checks shortly after it
// starts, then at most once a day, and never while an update holds the
// node's update lock; an UpdateDocker dry run or upgrade also refreshes it.
// added in 0.2.5 (docker check)
message DockerUpdateInfo {
  // Upstream version of the installed Docker Engine package, for example
  // "29.9.3". Empty when updatable is false.
  string installed = 1;
  // The newest version the package manager offers; equal to installed when
  // nothing newer is there. Empty when updatable is false.
  string candidate = 2;
  // "apt", "dnf" or "yum"; empty when there is no package manager the
  // agent drives.
  string package_manager = 3;
  // When the check ran, on the agent's clock.
  google.protobuf.Timestamp checked_at = 4;
  // UpdateDocker can upgrade Docker here. False when Docker Engine did not
  // come from a package manager the agent drives (static binaries, snap) or
  // there is none; reason says why.
  bool updatable = 5;
  // Why updatable is false, a sentence for people; empty otherwise.
  string reason = 6;
}

// BuildxInfo is the result of `docker buildx version` on the node.
// added in 0.2.1 (build default)
message BuildxInfo {
  // The command ran and exited 0.
  bool installed = 1;
  // What it printed as the version, for example "v0.29.1"; empty when it
  // is not installed.
  string version = 2;
}

// WingsInfo describes a Pelican Wings installation found next to the agent.
message WingsInfo {
  string version = 1;
  // Dynamic configuration folder of the Wings fork's Traefik. When set the
  // agent writes its seylo-*.yml route files there instead of running its
  // own Traefik.
  string traefik_dynamic_dir = 2;
  // The fork advertises that it leaves foreign (seylo-*) route files alone.
  bool foreign_routes_supported = 3;
  // Name of the fork's Traefik container (the proxy in front of services
  // and the panel on this node). The panel trusts X-Forwarded-* only from
  // its proxy containers; without Wings that is the agent's own Traefik.
  string proxy_container = 4;
}
