syntax = "proto3";

package seylo.agent.v1;

// Backups go straight from the node to S3-compatible storage (S3, R2, ...);
// the panel only schedules them and records results.

message BackupDestination {
  // For example "https://<account>.r2.cloudflarestorage.com".
  string endpoint = 1;
  string region = 2;
  string bucket = 3;
  // Key prefix inside the bucket.
  string prefix = 4;
  // Empty when signing_id is set.
  string access_key_id = 5;
  // Empty when signing_id is set.
  string secret_access_key = 6;
  bool path_style = 7;
  // Set by panels that keep the destination's keys to themselves (0.2 and
  // later, for agents that advertised backup.signed.v1), in place of
  // access_key_id and secret_access_key: the agent asks
  // PanelService.SignBackupRequests with this id for each storage step. The
  // panel signs only this run's own object, so a node never holds a key
  // that reaches other services' backups. Such a RunBackupRequest has
  // keep_last 0: the panel applies retention itself. The backup's run id,
  // or the restore's run id. Empty means the keys are set (older panels).
  string signing_id = 8;
}

message BackupSubject {
  string service_id = 1;
  oneof what {
    // A volume of the service, archived as .tar.gz.
    string volume = 2;
    // A logical dump of the service's database (engine from DatabaseSpec).
    DatabaseDump database = 3;
  }
}

message DatabaseDump {
  // Without selections: empty means everything on the server (every
  // database, for Postgres the roles too), set means that one database.
  // Panels from 0.2.15 set it as well when exactly one database is
  // chosen, so an agent without backup.select.v1 would still dump only
  // that database. On a restore: the database a single-database object
  // goes into (empty: the service's main database).
  string database = 1;
  // added in 0.2.15 (backup.select.v1): what to back up, by name. Empty
  // keeps the behaviour above. Set, the agent lists the server right
  // before the dump: a chosen database or table that no longer exists is
  // skipped with a line in BackupResult.warnings, and the backup fails
  // when nothing is left (a database whose chosen tables are all gone is
  // never widened to the whole database). Tables only with exactly one
  // database. On a restore: what the object holds (the backup's recorded
  // contents); exactly that is replaced, everything else stays.
  repeated DatabaseSelection selections = 2;
}

// One chosen database, optionally only some of its tables (Postgres and
// MySQL) or collections (MongoDB). added in 0.2.15
message DatabaseSelection {
  string database = 1;
  // Empty: the whole database.
  repeated TableRef tables = 2;
}

// A table or collection by name. added in 0.2.15
message TableRef {
  // Postgres only: the table's schema. Separate from name, never a dotted
  // string.
  string schema = 1;
  string name = 2;
}

// What a backup holds, as the database reported it right before the dump:
// names, approximate rows and sizes inside the database (not the size of
// the compressed object). added in 0.2.15
message BackupContents {
  // Everything on the server (no selection): databases lists what was
  // there. A whole-server backup whose measurement failed has
  // whole_server set and no databases (BackupResult.warnings says why).
  bool whole_server = 1;
  repeated DatabaseContents databases = 2;
}

message DatabaseContents {
  string name = 1;
  // On disk inside the database server, indexes included. For a backup of
  // some tables only, the sum of those tables.
  uint64 size_bytes = 2;
  // The engine's estimate; -1 when it has none.
  int64 approx_rows = 3;
  // Every table or collection the backup holds of this database, also
  // those left out of tables.
  uint32 table_count = 4;
  // The biggest first. At most 500 per database and 2000 per result.
  repeated TableContents tables = 5;
  // Some tables are not listed (the caps); the totals above still count them.
  bool tables_truncated = 6;
}

message TableContents {
  // Postgres: the schema. Empty for MySQL, MariaDB and MongoDB.
  string schema = 1;
  string name = 2;
  uint64 size_bytes = 3;
  // The engine's estimate; -1 when it has none (a Postgres table never
  // analysed).
  int64 approx_rows = 4;
}

// InspectDatabaseRequest lists a database service's databases (database
// empty: names, sizes and table counts, no tables) or one database's
// tables or collections, through the same helper and sign-in as a backup.
// Postgres, MySQL, MariaDB and MongoDB only. added in 0.2.15
message InspectDatabaseRequest {
  string service_id = 1;
  string database = 2;
}

message InspectDatabaseResponse {
  // whole_server is false. With a database asked for: that one database,
  // or none when it does not exist; its tables are capped at 5000.
  BackupContents contents = 1;
}

// RunBackupRequest starts a backup and returns once it is accepted. The
// result arrives as a durable BackupResult event, so it survives a dropped
// connection.
message RunBackupRequest {
  string backup_id = 1;
  string run_id = 2;
  BackupSubject subject = 3;
  BackupDestination destination = 4;
  // Volume backups only: stop the service for the copy and start it again
  // afterwards, for apps (SQLite and friends) whose files are not safe to
  // copy while they run. Database dumps never need it.
  bool stop_service = 5;
  // Retention: after a successful upload keep only the newest keep_last
  // objects of this backup_id (same service, same prefix) and delete the
  // older ones. 0 keeps everything.
  uint32 keep_last = 6;
}

message RunBackupResponse {}

// Object keys written by RunBackup:
//
//   <prefix>/<service_id>/<backup_id>/<UTC 20060102T150405Z>-<run_id><ext>
//
// where ext is ".tar.gz" for volumes, ".dump" for a Postgres custom-format
// dump of one database, ".sql.gz" for pg_dumpall, mysqldump and
// mariadb-dump, ".archive.gz" for mongodump, ".rdb.gz" for Redis and
// ".bundle" (0.2.15) for several chosen Postgres or MongoDB databases in
// one object (one pg_dump or mongodump per database, framed as
// go/internal/backup/bundle.go describes). Keys sort by time, which is
// what retention relies on. Restores read the format from the extension.

// BackupProgress is best-effort progress of a running backup.
message BackupProgress {
  string backup_id = 1;
  string run_id = 2;
  BackupPhase phase = 3;
  // Bytes uploaded so far (after compression).
  uint64 bytes_done = 4;
}

enum BackupPhase {
  BACKUP_PHASE_UNSPECIFIED = 0;
  // Stopping the service for a consistent volume copy (stop_service).
  BACKUP_PHASE_STOPPING_SERVICE = 1;
  // Archiving or dumping and uploading at the same time.
  BACKUP_PHASE_UPLOADING = 2;
  BACKUP_PHASE_STARTING_SERVICE = 3;
  // Deleting objects past keep_last.
  BACKUP_PHASE_PRUNING = 4;
}

// RestoreBackupRequest restores an object into the subject and returns when
// done. The service is stopped during a volume restore.
message RestoreBackupRequest {
  BackupSubject subject = 1;
  BackupDestination destination = 2;
  string object_key = 3;
}

message RestoreBackupResponse {
  uint64 restored_bytes = 1;
}
