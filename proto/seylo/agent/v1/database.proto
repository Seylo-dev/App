syntax = "proto3";

package seylo.agent.v1;

import "google/protobuf/duration.proto";

// DatabaseSpec is set on SERVICE_KIND_DATABASE services. The image, env and
// volumes in ServiceSpec are already filled for the engine; this message
// adds what the agent needs for tools, backups and exposure.
message DatabaseSpec {
  DatabaseEngine engine = 1;
  // Engine version, for example "17" for Postgres. Display and backup
  // tooling only; the image decides what runs.
  string version = 2;
  DatabaseCredentials credentials = 3;
  DatabaseTools tools = 4;
  DatabaseExposure exposure = 5;
  // The separate login databases created before 0.2.9 had for their
  // exposed port ("external"), sent whether or not exposure is on; empty
  // for newer databases and the Redis-like engines. Agents that advertise
  // "database.exposure.v2" disable it inside the running database once per
  // node, never deleting data: Postgres ALTER ROLE ... NOLOGIN, MySQL and
  // MariaDB ACCOUNT LOCK, Mongo dropUser, ClickHouse DROP USER. Never the
  // admin user.
  string retired_exposed_user = 6; // added in 0.2.9 (exposure.v2)
}

// The engines from VALKEY on need an agent that advertises the capability
// "database.engines.v2" in NodeFacts.capabilities (it has no RPC of its
// own): an older agent would run the container but fail its shell, web UI
// and backups, and relay its exposed port without TLS. The panel creates
// them only on such nodes and never sends their exposure to other agents.
enum DatabaseEngine {
  DATABASE_ENGINE_UNSPECIFIED = 0;
  DATABASE_ENGINE_POSTGRES = 1;
  DATABASE_ENGINE_MYSQL = 2;
  DATABASE_ENGINE_MARIADB = 3;
  DATABASE_ENGINE_MONGO = 4;
  DATABASE_ENGINE_REDIS = 5;
  // Redis-compatible: valkey-cli, RDB dumps over the replication protocol.
  DATABASE_ENGINE_VALKEY = 6; // added in 0.2 (engines)
  // Redis-compatible: keydb-cli, RDB dumps; its append-only file is one
  // file (appendonly.aof), not a folder.
  DATABASE_ENGINE_KEYDB = 7; // added in 0.2 (engines)
  // Redis-compatible: redis-cli; no replication dump, so backups run SAVE
  // RDB into the data volume (the server runs with --dbfilename dump and
  // --df_snapshot_format=false so its snapshots are dump.rdb).
  DATABASE_ENGINE_DRAGONFLY = 8; // added in 0.2 (engines)
  // Native protocol on 9000 (the port exposure uses), HTTP on 8123;
  // backups are BACKUP/RESTORE through a file in the data volume.
  DATABASE_ENGINE_CLICKHOUSE = 9; // added in 0.2 (engines)
}

// DatabaseCredentials let the agent open pre-logged-in shells, run dumps
// for backups and sign in the web UI.
message DatabaseCredentials {
  string admin_user = 1;
  string admin_password = 2;
  // Default database for shells and the web UI.
  string database = 3;
}

message DatabaseTools {
  // Allow the on-demand web UI (picked by engine). It starts on the first
  // ticket-authenticated request through the edge and stops when idle.
  bool web_ui = 1;
  // Default 15m.
  google.protobuf.Duration web_ui_idle_timeout = 2;
}

// DatabaseExposure publishes the database port through the portgate. It
// is TLS only, with the database's own credentials (DatabaseCredentials):
// the gate terminates TLS for Mongo, ClickHouse and the Redis-like
// engines, and for Postgres, MySQL and MariaDB, which negotiate TLS inside
// their protocol with their own certificate, it refuses a client that
// does not ask for TLS. Agents without "database.exposure.v2" relay
// Postgres, MySQL and MariaDB without that check, so the panel sends their
// exposure only to agents that advertise it.
message DatabaseExposure {
  bool enabled = 1;
  uint32 host_port = 2;
  // Empty means anyone may connect; the UI warns about it.
  repeated string allowed_source_cidrs = 3;
  // Host name for the ACME certificate the edge obtains for the database.
  // Empty means a self-signed certificate.
  string tls_hostname = 4;
  // A separate user for connections through the exposed port, which agents
  // before 0.2.9 created (or updated) when exposure was on. Panels from
  // 0.2.9 leave them empty and agents from 0.2.9 ignore them; the old user
  // is retired instead (DatabaseSpec.retired_exposed_user).
  string user = 5;
  string password = 6;
}
