syntax = "proto3";

package seylo.agent.v1;

import "google/protobuf/duration.proto";
import "seylo/agent/v1/routing.proto";
import "seylo/agent/v1/service.proto";
import "seylo/agent/v1/tailnet.proto";

// DesiredState is everything the panel wants on one node. The agent stores
// the last one on disk and keeps reconciling toward it while the panel is
// unreachable.
message DesiredState {
  // Increases with every change on the panel. The agent ignores anything
  // older than what it already applied.
  uint64 revision = 1;
  repeated ServiceSpec services = 2;
  // Project networks (seylo-p-<project id>) this node needs. Networks of
  // projects with no service here are removed.
  repeated ProjectNetwork networks = 3;
  NodeSettings settings = 4;
}

message ProjectNetwork {
  string project_id = 1;
}

// NodeSettings are node-wide knobs the panel controls.
message NodeSettings {
  // Global maintenance page; overrides every service on the node.
  Maintenance maintenance = 1;
  // Next to Wings: give game servers CPU priority over Seylo services by
  // lowering the CPUWeight of seylo.slice.
  bool games_first_cpu = 2;
  // Contact address for Let's Encrypt.
  string acme_email = 3;
  // Wildcard base for auto domains, for example "n1.example.com" with a
  // *.n1.example.com A record pointing at this node.
  string wildcard_domain = 4;
  LogRetention log_retention = 5;
  // Builds this node runs at the same time; more wait in the agent's
  // queue. 0 means the panel sends this node no builds (Can build is off).
  // Since 0.2.1 the agent's buildx health check follows it: it runs when
  // this is above 0 or config.yml sets can_build.
  uint32 max_parallel_builds = 6;
  // The panel's auto-update switch. When on, an agent older than the
  // panel updates itself to the panel's release after it connects.
  bool auto_update = 7;
  // Mutual TLS for node-to-node load balancing (the LB entry point). Unset
  // (older panels): the entry point accepts any client, as before.
  LoadBalancerTls lb_tls = 8;
  // Docker cleanup the agent runs by itself on a schedule or when a disk
  // fills up, also while the panel is down. Unset (older panels) or not
  // enabled: no scheduled cleanup.
  CleanupSchedule cleanup = 9; // added in 0.2 (nodeops)
  // The owner allowed root shells on this host from the panel (HostShell).
  // The agent refuses HostShell while this is false and closes open ones
  // when it turns false.
  bool host_shell = 10; // added in 0.2 (nodeops)
  // Tailscale Serve for the panel. Only the panel node gets it; unset
  // (older panels, other nodes) means the agent keeps no Serve entry.
  TailnetServe tailnet = 11; // added in 0.2.1 (tailnet)
  // The node's name in the panel, so `seylo status` shows a rename made
  // while the agent is connected (HelloAccepted.node_name has it at each
  // connect). Empty from older panels. Added in 0.2.14.
  string node_name = 12;
}

// CleanupSchedule is when and what the agent cleans up by itself. It only
// ever touches resources labeled seylo.managed, like Prune. Each run is a
// durable CleanupRun event. added in 0.2 (nodeops)
message CleanupSchedule {
  bool enabled = 1;
  // Five-field cron expression evaluated in the node's own time zone
  // (/etc/localtime, NodeFacts.time_zone). Empty: only the disk trigger.
  string cron = 2;
  // Also run when the file system holding the data dir or Docker's root is
  // more than this percent full (read by the disk checks every 10 minutes).
  // At most once an hour, and every 6 hours while it stays above. 0 = off.
  uint32 disk_percent = 3;
  // What to clean, as in PruneRequest.
  bool images = 4;
  bool build_cache = 5;
  bool stopped_containers = 6;
  // Docker volumes and data folders of services removed from this node
  // (PruneRequest.orphaned_service_data).
  bool unused_volumes = 7;
}

// LoadBalancerTls is this node's identity on the LB entry point, issued by
// the panel's LB certificate authority.
message LoadBalancerTls {
  // PEM of the panel's LB CA. Peers and clients are verified against it.
  string ca_pem = 1;
  // This node's certificate (PEM, may include intermediates) and its private
  // key (PEM). Valid for server_name, with both serverAuth and clientAuth
  // extended key usages.
  string cert_pem = 2;
  string key_pem = 3;
  // The DNS name every node's LB certificate carries; balancing nodes send it
  // as SNI and verify it, for example "lb.seylo.internal". Agents that know
  // peers use it only for peers listed with it.
  string server_name = 4;
  // This node's own name, for example "<node id>.lb.seylo.internal". The
  // certificate carries it next to server_name and the LB entry point
  // answers it as SNI. Empty from older panels. added in 0.2 (lb-cert)
  string node_server_name = 5;
  // The certificate this node had before cert_pem (with its issuer) and its
  // key, until it expires. As a client the node presents whichever of the
  // two the peer asks for (the issuers in the peer's certificate request),
  // so a peer that has not heard of the new one yet still takes it. Empty
  // when there is none. added in 0.2 (lb-cert)
  string previous_cert_pem = 6;
  string previous_key_pem = 7;
  // Every node the panel holds a current LB certificate for, this one
  // included. With peers the LB entry point accepts only a client
  // certificate one of them was issued (a removed node's, or one replaced
  // and given up, is refused), and a balancing node verifies each peer by
  // the server_name listed for it and skips copies on nodes not listed.
  // Empty (older panels): any certificate of ca_pem, verified by
  // server_name. added in 0.2 (lb-cert)
  repeated LoadBalancerPeer peers = 8;
}

// LoadBalancerPeer is one node in LoadBalancerTls.peers. added in 0.2 (lb-cert)
message LoadBalancerPeer {
  string node_id = 1;
  // The name to send as SNI and verify when balancing to this node: its own
  // name once its agent answers it, else the shared server_name.
  string server_name = 2;
  // PEM of the one-off CA certificates (each signed by ca_pem, one per node
  // certificate) that issued the certificates this node may present: the
  // current one, and the one before while the node has not confirmed the
  // new one.
  repeated string issuer_pems = 3;
  // The node may still present a certificate issued straight by ca_pem (by a
  // panel before 0.2, which did not give certificates an issuer of their
  // own). While any peer has it, the LB entry point accepts every
  // certificate of ca_pem, as before.
  bool legacy = 4;
}

// LogRetention bounds the per-service log store (logs/<service id>/). The
// oldest segments go first when either limit is reached.
message LogRetention {
  // 0 means 100 MiB per service.
  uint64 max_bytes_per_service = 1;
  // 0 means 14 days.
  google.protobuf.Duration max_age = 2;
}

// SyncDesiredRequest replaces the whole desired state. The panel sends it
// after every connect, then switches to ApplyService/RemoveService.
message SyncDesiredRequest {
  DesiredState state = 1;
}

message SyncDesiredResponse {
  // Revision the agent now reconciles toward.
  uint64 accepted_revision = 1;
  // Services whose spec the agent could not use. The rest of the state was
  // taken: a refused service keeps running its last valid spec, or is left
  // out when it had none. Empty when every spec was taken. Agents from
  // before this field refused the whole state with INVALID_ARGUMENT
  // instead (ApplyService still does that for its one spec).
  repeated RefusedService refused = 2;
}

// RefusedService is one spec of a SyncDesired the agent refused.
message RefusedService {
  string service_id = 1;
  // Generation of the refused spec.
  uint64 generation = 2;
  // Why, in words for people (the validation error).
  string message = 3;
}

// ApplyServiceRequest creates or updates one service. Deploys, rollbacks
// (an older image digest) and setting changes are all applies.
message ApplyServiceRequest {
  // Desired state revision this change belongs to.
  uint64 revision = 1;
  ServiceSpec service = 2;
}

message ApplyServiceResponse {
  uint64 accepted_revision = 1;
}

message RemoveServiceRequest {
  uint64 revision = 1;
  string service_id = 2;
  // Also delete volumes and files. Without it they stay under
  // services/<id>/ until cleanup removes orphans.
  bool delete_data = 3;
}

message RemoveServiceResponse {
  uint64 accepted_revision = 1;
}

// RestartServiceRequest restarts running instances without changing the
// desired state (a restart is not a deploy).
message RestartServiceRequest {
  string service_id = 1;
}

message RestartServiceResponse {}
